[project]
name = "atf-agent-runtime"
version = "0.0.0"
description = "Reference agent runtime: authorizes every invocation from T2 claims only (ADR-0014)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "trustkit",
    "trustkit-aws",
    "trustkit-policy",
    "trustkit-http",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf_agent_runtime"]

[tool.uv.sources]
trustkit = { workspace = true }
trustkit-aws = { workspace = true }
trustkit-policy = { workspace = true }
trustkit-http = { workspace = true }
