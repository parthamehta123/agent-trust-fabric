[project]
name = "atf-mcp-gateway"
version = "0.0.0"
description = "Self-hosted MCP gateway for non-AgentCore agents: delegated credentials, tool pinning, SSRF-safe egress (ADR-0017)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "trustkit",
    "trustkit-http",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf_mcp_gateway"]

[tool.uv.sources]
trustkit = { workspace = true }
trustkit-http = { workspace = true }
