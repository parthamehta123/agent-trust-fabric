[project]
name = "atf-interceptor"
version = "0.0.0"
description = "AgentCore Gateway REQUEST/RESPONSE interceptor Lambda: the single ingress exchange point (ADR-0002, ADR-0012)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trustkit",
    "trustkit-aws",
    "trustkit-http",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf_interceptor"]

[tool.uv.sources]
trustkit = { workspace = true }
trustkit-http = { workspace = true }
trustkit-aws = { workspace = true }
