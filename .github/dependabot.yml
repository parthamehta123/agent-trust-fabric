version: 2

# Supply-chain policy (ADR-0026 §2, TM-CP-03):
# - cooldown: never propose a release younger than 14 days (the project's minimum age).
# - Python base images follow the project's interpreter (requires-python >=3.12,<3.13); a Python
#   minor upgrade is a deliberate change (ADR, lockfile, wheels), so only patch and digest updates
#   are proposed for them.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 14

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /deploy/local
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "lambda/python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "public.ecr.aws/lambda/python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # IaC tool images (checkov's Python base, tflint's distroless base): digest refreshes only.
  - package-ecosystem: docker
    directory: /deploy/iac
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
