name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN; jobs opt in to anything more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a full commit SHA (TM-CP-03); Dependabot proposes updates.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - name: Audit locked dependencies for known CVEs
        run: |
          uv export --frozen --no-emit-workspace --no-hashes -o requirements.audit.txt
          uv run pip-audit --strict -r requirements.audit.txt
      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  compose-e2e:
    # Full local stack over TLS (ADR-0015): hardened containers, Lambda RIE, isolation checks.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - run: make up
      - run: make e2e
      - run: make logs-scan
      - name: Diagnose a failure (only after the token/key scan passes)
        if: failure()
        run: |
          make logs-scan
          # compose.yaml takes the container user from the Makefile's exports (run via make).
          export ATF_UID="$(id -u)" ATF_GID="$(id -g)"
          docker compose ps -a
          for s in bundle-publisher agent-registry inference-gateway mcp-gateway; do
            echo "::group::$s"; docker compose logs --no-color --tail 150 "$s"; echo "::endgroup::"
          done
      - if: always()
        run: make down

  iac:
    # ADR-0026 §25: the same digest-pinned, signature-verified tools as on a laptop (OpenTofu,
    # our rebuilt tflint, sandboxed checkov, RR-8). No cloud credentials in this job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: make iac-tools
      - run: make iac-validate
