name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN; jobs opt in to anything more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TODO(supply-chain): pin every `uses:` to a full commit SHA (Dependabot keeps them fresh).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - name: Audit locked dependencies for known CVEs
        run: |
          uv export --frozen --no-emit-workspace --no-hashes -o requirements.audit.txt
          uv run pip-audit --strict -r requirements.audit.txt
      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  terraform:
    # Enabled once infra/terraform exists (Phase 6).
    if: ${{ hashFiles('infra/terraform/**/*.tf') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra/terraform --recursive
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
