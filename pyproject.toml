# Virtual uv workspace root: no [project] table, so the root is never built or published.
# Each package/service declares its own runtime deps; shared dev tooling lives here.

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
trustkit = { workspace = true }
trustkit-aws = { workspace = true }
mock-idp = { workspace = true }
trustkit-http = { workspace = true }
atf-interceptor = { workspace = true }
atf-agent-runtime = { workspace = true }
gateway-emulator = { workspace = true }
devstack = { workspace = true }
atf-mcp-gateway = { workspace = true }
mock-mcp = { workspace = true }
mock-llm = { workspace = true }
atf-inference-gateway = { workspace = true }
atf-agent-registry = { workspace = true }
trustkit-policy = { workspace = true }

[dependency-groups]
dev = [
    "trustkit",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
    "trustkit-aws",
    "moto[dynamodb,kms,s3,secretsmanager]>=5.0",
    "boto3-stubs[bedrock-runtime,dynamodb,kms,s3,secretsmanager]>=1.35",
    "mock-idp",
    "trustkit-http",
    "atf-interceptor",
    "atf-agent-runtime",
    "gateway-emulator",
    "devstack",
    "atf-mcp-gateway",
    "mock-mcp",
    "mock-llm",
    "atf-inference-gateway",
    "atf-agent-registry",
    "trustkit-policy",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # flake8-bandit (security) — replaces a separate bandit run
    "BLE",           # blind except
    "A",             # shadowing builtins
    "C4", "SIM", "RET", "PIE",
    "DTZ",           # naive datetimes (token exp/iat math must be tz-aware)
    "PT",            # pytest style
    "TRY",           # exception hygiene
    "ASYNC",
    "RUF",
]

# TRY003: our exception messages are deliberately fixed, log-safe strings chosen at the raise site.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["packages/trustkit/src", "packages/trustkit_aws/src", "packages/mock_idp/src", "packages/trustkit_http/src", "services/interceptor/src", "services/agent_runtime/src", "packages/gateway_emulator/src", "packages/devstack/src", "services/mcp_gateway/src", "packages/mock_mcp/src", "packages/mock_llm/src", "services/inference_gateway/src", "services/agent_registry/src", "packages/trustkit_policy/src"]
packages = ["trustkit", "trustkit_aws", "mock_idp", "trustkit_http", "atf_interceptor", "atf_agent_runtime", "gateway_emulator", "devstack", "atf_mcp_gateway", "mock_mcp", "mock_llm", "atf_inference_gateway", "atf_agent_registry", "trustkit_policy"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "security: negative-path tests that map to a threat-model mitigation ID (TM-*)",
    "compose: end-to-end tests against the running docker compose stack (make up e2e)",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["trustkit", "trustkit_aws", "mock_idp", "trustkit_http", "atf_interceptor", "atf_agent_runtime", "gateway_emulator", "devstack", "atf_mcp_gateway", "mock_mcp", "mock_llm", "atf_inference_gateway", "atf_agent_registry", "trustkit_policy"]

[tool.coverage.report]
fail_under = 95
show_missing = true
