# Local ingress stack (ADR-0014, ADR-0015). Generate inputs first: `make certs wheels`.
#
#   host ──TLS──▶ gateway ──(core, RIE invoke)──▶ interceptor ──TLS──▶ mock-idp
#                   │ └────────(agent, TLS)──────▶ agent-runtime ──TLS──▶ mock-idp (JWKS)
#                   └────────(idp, TLS)──────────▶ mock-idp (inbound JWKS)
#
# Only `gateway` (8443) and `mock-idp` (9443, for /_test/login) are published, on 127.0.0.1.
# agent-runtime is reachable only from the gateway (network isolation, ADR-0014 §1).

x-hardening: &hardening
  user: "${ATF_UID:?run via make}:${ATF_GID:?run via make}"
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

x-hardening-own-user: &hardening-own-user
  # For third-party images that already run as a non-root user of their own.
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

# Policy bundle consumers (ADR-0022/0023): pinned public key, read-only bundle mount. Local ages
# are short so e2e can prove revocation and fail-closed staleness in seconds (ceiling: 600 s).
x-bundle-env: &bundle-env
  ATF_BUNDLE_ISSUER: atf-bundle-publisher
  ATF_BUNDLE_PUBLIC_JWK_PATH: /run/config/bundle-key.jwk
  ATF_BUNDLE_PATH: /run/bundles/bundle.jws
  ATF_BUNDLE_MAX_AGE_S: "20"
  ATF_BUNDLE_REFRESH_S: "2"

x-mcp-env: &mcp-env
  ATF_ENV: local
  ATF_CA_BUNDLE: /run/certs/ca.pem
  ATF_DDB_TABLE: mcp-servers
  ATF_EGRESS_PROFILE_PATH: /run/config/mcp-egress.json
  ATF_LOCAL_KEYS_DIR: /run/keys
  ATF_SSRF_ALLOW_CIDRS: 10.230.0.0/16
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
  # DynamoDB Local checks the key *format* (alphanumeric) but not the values (ED-9).
  AWS_ACCESS_KEY_ID: localdummy
  AWS_SECRET_ACCESS_KEY: localdummy

x-healthcheck: &tls-healthcheck
  test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://localhost:8443/ping', context=ssl.create_default_context(cafile='/run/certs/ca.pem'), timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10

services:
  mock-idp:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: mock-idp } }
    command: ["mock_idp.app:app_from_env"]
    environment:
      ATF_ENV: local
      ATF_IDP_BASE_URL: https://mock-idp:8443
      ATF_TOPOLOGY_PATH: /run/config/mock-idp-topology.json
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/mock-idp.pem:/run/certs/tls.pem:ro
      - ./.local-ca/mock-idp.key:/run/certs/tls.key:ro
      - ./.local-ca/mock-idp-topology.json:/run/config/mock-idp-topology.json:ro
    ports: ["127.0.0.1:9443:8443"]
    networks: [edge, idp, idp-admin, idp-registry, idp-beta]
    healthcheck: *tls-healthcheck

  interceptor:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/interceptor.Dockerfile }
    environment:
      ATF_ENV: local
      ATF_PROFILES_PATH: /run/config/profiles.json
      ATF_CA_BUNDLE: /run/certs/ca.pem
      ATF_LOCAL_KEYS_DIR: /run/keys
      AWS_REGION: us-east-1
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/profiles.json:/run/config/profiles.json:ro
      # Least privilege: only the key its ingress profile signs with (not the whole directory).
      - ./.local-ca/client-keys/chat.pem:/run/keys/chat.pem:ro
    networks: [core, idp]

  agent-runtime:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-agent-runtime } }
    command: ["atf_agent_runtime.app:app_from_env"]
    environment:
      ATF_RESOURCE_ISSUER: https://mock-idp:8443/oauth2/agent-alpha
      ATF_RESOURCE_AUDIENCE: api://agent-alpha
      ATF_RESOURCE_JWKS_URI: https://mock-idp:8443/oauth2/agent-alpha/v1/keys
      ATF_CA_BUNDLE: /run/certs/ca.pem
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/agent-runtime.pem:/run/certs/tls.pem:ro
      - ./.local-ca/agent-runtime.key:/run/certs/tls.key:ro
    networks: [agent, idp]
    healthcheck:
      <<: *tls-healthcheck
      # Its certificate deliberately has no 'localhost' SAN: check by service name, full verification.
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://agent-runtime:8443/ping', context=ssl.create_default_context(cafile='/run/certs/ca.pem'), timeout=2)"]

  gateway:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: gateway-emulator } }
    command: ["gateway_emulator.app:app_from_env"]
    environment:
      ATF_GATEWAY_ARN: arn:aws:bedrock-agentcore:us-east-1:123456789012:gateway/gw-alpha
      ATF_INBOUND_ISSUER: https://mock-idp:8443/oauth2/ingress
      ATF_INBOUND_AUDIENCE: api://agent-ingress
      ATF_INBOUND_JWKS_URI: https://mock-idp:8443/oauth2/ingress/v1/keys
      ATF_INTERCEPTOR_URL: http://interceptor:8080/2015-03-31/functions/function/invocations
      ATF_TARGET_NAME: agent-alpha
      ATF_RUNTIME_URL: https://agent-runtime:8443/invocations
      ATF_CA_BUNDLE: /run/certs/ca.pem
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/gateway.pem:/run/certs/tls.pem:ro
      - ./.local-ca/gateway.key:/run/certs/tls.key:ro
    ports: ["127.0.0.1:8443:8443"]
    networks: [edge, core, agent, idp]
    depends_on:
      mock-idp: { condition: service_healthy }
      agent-runtime: { condition: service_healthy }
      interceptor: { condition: service_started }
    healthcheck: *tls-healthcheck

  # ---------------------------------------------------------------- MCP gateway (ADR-0017/0018)
  # Data plane and admin plane share NO network: each shared dependency is reached over a
  # plane-specific network, so the admin port is unreachable from anything agent-facing.

  dynamodb-local:
    <<: *hardening-own-user
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    # Deliberate, scoped relaxation (ED-9): DynamoDB Local extracts its native SQLite library
    # to /tmp and must map it executable, so this test-only container's /tmp allows exec.
    tmpfs: ["/tmp:size=64m,mode=1777,exec"]
    networks: [ddb-data, ddb-admin, ddb-inference, ddb-registry]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20

  mock-mcp:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: mock-mcp } }
    command: ["mock_mcp.app:app_from_env"]
    environment:
      ATF_ENV: local
      ATF_TOOL_ISSUER: https://mock-idp:8443/oauth2/tool-tickets
      ATF_TOOL_AUDIENCE: api://tool-tickets
      ATF_TOOL_JWKS_URI: https://mock-idp:8443/oauth2/tool-tickets/v1/keys
      ATF_CA_BUNDLE: /run/certs/ca.pem
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/mock-mcp.pem:/run/certs/tls.pem:ro
      - ./.local-ca/mock-mcp.key:/run/certs/tls.key:ro
    networks:
      tools-data: { aliases: [mock-mcp.tools.internal] }
      tools-admin: { aliases: [mock-mcp.tools.internal] }
      idp: {}
    healthcheck:
      <<: *tls-healthcheck
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://mock-mcp.tools.internal:8443/ping', context=ssl.create_default_context(cafile='/run/certs/ca.pem'), timeout=2)"]

  mcp-gateway:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-mcp-gateway } }
    command: ["atf_mcp_gateway.app:data_app_from_env"]
    environment:
      <<: [*mcp-env, *bundle-env]
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/mcp-gateway.pem:/run/certs/tls.pem:ro
      - ./.local-ca/mcp-gateway.key:/run/certs/tls.key:ro
      - ./.local-ca/mcp-egress.json:/run/config/mcp-egress.json:ro
      - ./.local-ca/client-keys/gateway.pem:/run/keys/gateway.pem:ro
      - ./.local-ca/bundle-key.jwk:/run/config/bundle-key.jwk:ro
      - ./.local-ca/bundles:/run/bundles:ro
    ports: ["127.0.0.1:8444:8443"]
    networks: [mcp-edge, ddb-data, tools-data, idp]
    depends_on:
      mcp-admin: { condition: service_healthy }
      mock-mcp: { condition: service_healthy }
      bundle-publisher: { condition: service_healthy }
    healthcheck: *tls-healthcheck

  mcp-admin:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-mcp-gateway } }
    command: ["atf_mcp_gateway.app:admin_app_from_env"]
    environment:
      <<: *mcp-env
      ATF_SSRF_ALLOW_CIDRS: 10.231.0.0/16
      ATF_ADMIN_ISSUER: https://mock-idp:8443/oauth2/admin
      ATF_ADMIN_AUDIENCE: api://mcp-admin
      ATF_ADMIN_JWKS_URI: https://mock-idp:8443/oauth2/admin/v1/keys
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/mcp-admin.pem:/run/certs/tls.pem:ro
      - ./.local-ca/mcp-admin.key:/run/certs/tls.key:ro
    ports: ["127.0.0.1:9445:8443"]
    networks: [admin-edge, ddb-admin, tools-admin, idp-admin]
    depends_on:
      dynamodb-local: { condition: service_healthy }
      mock-idp: { condition: service_healthy }
      mock-mcp: { condition: service_healthy }
    healthcheck: *tls-healthcheck

  # ---------------------------------------------------------------- Inference gateway (ADR-0019/0020)
  # Own audience, own DynamoDB network (no route to the MCP registry table), and the only
  # service on the internal `llm` network that reaches the model.

  mock-llm:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: mock-llm } }
    command: ["mock_llm.app:app_from_env"]
    environment:
      ATF_ENV: local
      ATF_MOCK_LLM_KEY: localdummy
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/mock-llm.pem:/run/certs/tls.pem:ro
      - ./.local-ca/mock-llm.key:/run/certs/tls.key:ro
    networks: [llm]
    healthcheck:
      <<: *tls-healthcheck
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://mock-llm:8443/ping', context=ssl.create_default_context(cafile='/run/certs/ca.pem'), timeout=2)"]

  inference-gateway:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-inference-gateway } }
    command: ["atf_inference_gateway.app:app_from_env"]
    environment:
      ATF_ENV: local
      ATF_CA_BUNDLE: /run/certs/ca.pem
      ATF_INFERENCE_PROFILE_PATH: /run/config/inference-profile.json
      ATF_MODEL_ROUTES_PATH: /run/config/model-routes.json
      ATF_BUDGET_TABLE: budgets
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: localdummy
      AWS_SECRET_ACCESS_KEY: localdummy
      # Provider credential for mock-llm only; agents' tokens never reach the provider.
      OPENAI_API_KEY: localdummy
      <<: *bundle-env
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/inference-gateway.pem:/run/certs/tls.pem:ro
      - ./.local-ca/inference-gateway.key:/run/certs/tls.key:ro
      - ./.local-ca/inference-profile.json:/run/config/inference-profile.json:ro
      - ./.local-ca/model-routes.json:/run/config/model-routes.json:ro
      - ./.local-ca/bundle-key.jwk:/run/config/bundle-key.jwk:ro
      - ./.local-ca/bundles:/run/bundles:ro
    ports: ["127.0.0.1:8445:8443"]
    networks: [inference-edge, ddb-inference, llm, idp]
    depends_on:
      dynamodb-local: { condition: service_healthy }
      mock-idp: { condition: service_healthy }
      mock-llm: { condition: service_healthy }
      bundle-publisher: { condition: service_healthy }
    healthcheck: *tls-healthcheck

  # ---------------------------------------------------------------- Registry + bundles (ADR-0021/0022)
  # The admin API can't sign; the publisher holds the only signing key, sits on ddb-registry only,
  # and writes bundles that gateways mount read-only.

  agent-registry:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-agent-registry } }
    command: ["atf_agent_registry.app:app_from_env"]
    environment:
      ATF_ENV: local
      ATF_CA_BUNDLE: /run/certs/ca.pem
      ATF_REGISTRY_ISSUER: https://mock-idp:8443/oauth2/registry
      ATF_REGISTRY_AUDIENCE: api://agent-registry
      ATF_REGISTRY_JWKS_URI: https://mock-idp:8443/oauth2/registry/v1/keys
      ATF_REGISTRY_TABLE: agents
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: localdummy
      AWS_SECRET_ACCESS_KEY: localdummy
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/agent-registry.pem:/run/certs/tls.pem:ro
      - ./.local-ca/agent-registry.key:/run/certs/tls.key:ro
    ports: ["127.0.0.1:9446:8443"]
    networks: [registry-edge, ddb-registry, idp-registry]
    depends_on:
      dynamodb-local: { condition: service_healthy }
      mock-idp: { condition: service_healthy }
    healthcheck: *tls-healthcheck

  bundle-publisher:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-agent-registry } }
    entrypoint: ["python", "-m", "atf_agent_registry.publish"]
    command: []
    environment:
      ATF_ENV: local
      ATF_REGISTRY_TABLE: agents
      ATF_BUNDLE_SIGNING_KEY: local:bundle
      ATF_LOCAL_KEYS_DIR: /run/keys
      ATF_BUNDLE_ISSUER: atf-bundle-publisher
      ATF_GUARDRAILS_PATH: /run/config/guardrails.cedar
      ATF_BUNDLE_DIR: /run/bundles
      ATF_BUNDLE_MAX_AGE_S: "20"
      ATF_BUNDLE_HEARTBEAT_S: "5"
      ATF_PUBLISH_POLL_S: "1"
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: localdummy
      AWS_SECRET_ACCESS_KEY: localdummy
    volumes:
      - ./.local-ca/bundle-signing/bundle.pem:/run/keys/bundle.pem:ro
      - ./policies/guardrails.cedar:/run/config/guardrails.cedar:ro
      - ./.local-ca/bundles:/run/bundles
    networks: [ddb-registry]
    depends_on:
      agent-registry: { condition: service_healthy }
    healthcheck:
      # Healthy = a bundle was written in the last 15 s (heartbeat is 5 s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/run/bundles/bundle.jws').st_mtime < 15 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 20

  # ---------------------------------------------------------------- Agent-to-agent (ADR-0024)
  # The A2A gateway is the only way into agent-beta (a2a-agents, pinned subnet for SSRF). Beta
  # validates its own delegated token and calls tools through the MCP gateway like any agent.

  agent-beta:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-agent-runtime } }
    command: ["atf_agent_runtime.app:app_from_env"]
    environment:
      <<: *bundle-env
      ATF_ENV: local
      ATF_RESOURCE_ISSUER: https://mock-idp:8443/oauth2/agent-beta
      ATF_RESOURCE_AUDIENCE: api://agent-beta
      ATF_RESOURCE_JWKS_URI: https://mock-idp:8443/oauth2/agent-beta/v1/keys
      ATF_CA_BUNDLE: /run/certs/ca.pem
      ATF_AGENT_ID: 0oa-agent-beta
      ATF_MCP_URL: https://mcp-gateway:8443/mcp
      ATF_WORKLOAD_CLIENT_ID: 0oa-agent-beta
      ATF_WORKLOAD_SIGNING_KEY: local:agent-beta
      ATF_WORKLOAD_TOKEN_ENDPOINT: https://mock-idp:8443/oauth2/workload/v1/token
      ATF_LOCAL_KEYS_DIR: /run/keys
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/agent-beta.pem:/run/certs/tls.pem:ro
      - ./.local-ca/agent-beta.key:/run/certs/tls.key:ro
      - ./.local-ca/client-keys/agent-beta.pem:/run/keys/agent-beta.pem:ro
      - ./.local-ca/bundle-key.jwk:/run/config/bundle-key.jwk:ro
      - ./.local-ca/bundles:/run/bundles:ro
    networks:
      a2a-agents: { aliases: [agent-beta.agents.internal] }  # FQDN: required by SSRF vetting
      idp-beta: {}  # its own path to the IdP: shares no network with other gateways
      mcp-edge: {}
    depends_on:
      mock-idp: { condition: service_healthy }
      bundle-publisher: { condition: service_healthy }
    healthcheck:
      <<: *tls-healthcheck
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://agent-beta:8443/ping', context=ssl.create_default_context(cafile='/run/certs/ca.pem'), timeout=2)"]

  a2a-gateway:
    <<: *hardening
    build: { context: ., dockerfile: deploy/local/service.Dockerfile, args: { SERVICE: atf-a2a-gateway } }
    command: ["atf_a2a_gateway.app:app_from_env"]
    environment:
      <<: *bundle-env
      ATF_ENV: local
      ATF_A2A_EGRESS_PROFILE_PATH: /run/config/a2a-egress.json
      ATF_A2A_PUBLIC_URL: https://localhost:8446
      ATF_A2A_TARGET_SCOPES: agent.invoke tickets.read
      ATF_CA_BUNDLE: /run/certs/ca.pem
      ATF_LOCAL_KEYS_DIR: /run/keys
      ATF_SSRF_ALLOW_CIDRS: 10.232.0.0/16
      AWS_REGION: us-east-1
    volumes:
      - ./.local-ca/ca.pem:/run/certs/ca.pem:ro
      - ./.local-ca/a2a-gateway.pem:/run/certs/tls.pem:ro
      - ./.local-ca/a2a-gateway.key:/run/certs/tls.key:ro
      - ./.local-ca/a2a-egress.json:/run/config/a2a-egress.json:ro
      - ./.local-ca/client-keys/a2a-gateway.pem:/run/keys/a2a-gateway.pem:ro
      - ./.local-ca/bundle-key.jwk:/run/config/bundle-key.jwk:ro
      - ./.local-ca/bundles:/run/bundles:ro
    ports: ["127.0.0.1:8446:8443"]
    networks: [a2a-edge, a2a-agents, idp]
    depends_on:
      agent-beta: { condition: service_healthy }
      bundle-publisher: { condition: service_healthy }
    healthcheck: *tls-healthcheck

networks:
  edge: {}
  core: { internal: true }
  agent: { internal: true }
  idp: { internal: true }
  mcp-edge: {}
  admin-edge: {}
  ddb-data: { internal: true }
  ddb-admin: { internal: true }
  # Pinned subnets sit outside Docker's default address pools (172.17-31/16, 192.168/16) so an
  # auto-assigned network can never collide with them, whatever the creation order.
  tools-data: { internal: true, ipam: { config: [{ subnet: 10.230.0.0/16 }] } }
  tools-admin: { internal: true, ipam: { config: [{ subnet: 10.231.0.0/16 }] } }
  idp-admin: { internal: true }
  inference-edge: {}
  ddb-inference: { internal: true }
  llm: { internal: true }
  registry-edge: {}
  ddb-registry: { internal: true }
  idp-registry: { internal: true }
  a2a-edge: {}
  a2a-agents: { internal: true, ipam: { config: [{ subnet: 10.232.0.0/16 }] } }
  idp-beta: { internal: true }
