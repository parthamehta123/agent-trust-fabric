[project]
name = "trustkit-policy"
version = "0.0.0"
description = "Policy decision point (Cedar, in-process) and signed policy bundles for gateways (ADR-0022)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cedarpy==4.12.1",
    "joserfc>=1.0",
    "pydantic>=2.8",
    "trustkit",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustkit_policy"]

[tool.uv.sources]
trustkit = { workspace = true }
