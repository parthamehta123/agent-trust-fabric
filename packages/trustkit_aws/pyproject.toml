[project]
name = "trustkit-aws"
version = "0.0.0"
description = "AWS adapters for trustkit: KMS signer, SSM/Secrets Manager profile source."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "cryptography>=43",
    "joserfc>=1.0",
    "trustkit",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustkit_aws"]

[tool.uv.sources]
trustkit = { workspace = true }
