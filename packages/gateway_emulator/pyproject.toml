[project]
name = "gateway-emulator"
version = "0.0.0"
description = "TEST INFRASTRUCTURE ONLY. Emulates documented AgentCore Gateway behaviour around interceptors (ADR-0014). Never deployed."
requires-python = ">=3.12,<3.13"
dependencies = [
    "joserfc>=1.0",
    "trustkit",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_emulator"]

[tool.uv.sources]
trustkit = { workspace = true }
