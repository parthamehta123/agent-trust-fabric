[project]
name = "mock-idp"
version = "0.0.0"
description = "TEST INFRASTRUCTURE ONLY. Local OIDC/OAuth AS: RFC 8693 token exchange to ID-JAG, RFC 7523 JWT-bearer to RFC 9068 access tokens. Never deployed."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "joserfc>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_idp"]
