[project]
name = "mock-mcp"
version = "0.0.0"
description = "TEST INFRASTRUCTURE ONLY. Minimal MCP tool server that independently verifies delegated tokens (ADR-0016) and can simulate a rug-pull. Never deployed."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "joserfc>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_mcp"]
