[project]
name = "trustkit"
version = "0.0.0"
description = "Shared identity and trust primitives: token validation, ID-JAG exchange, gateway profiles, fail-closed helpers, audit events."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustkit"]
