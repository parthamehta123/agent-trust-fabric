[project]
name = "trustkit-http"
version = "0.0.0"
description = "HTTP adapters for trustkit: hardened httpx token endpoint and JWKS fetcher."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "trustkit",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustkit_http"]

[tool.uv.sources]
trustkit = { workspace = true }
